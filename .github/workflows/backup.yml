name: Respaldo de Supabase

on:
  schedule:
    # Todos los domingos a las 05:00 UTC.
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Falta el secreto SUPABASE_DB_URL."
            exit 1
          fi

          FILE="supabase-backup-$(date +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump "${SUPABASE_DB_URL}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file "${FILE}"
          echo "BACKUP_FILE=${FILE}" >> "${GITHUB_ENV}"

      - name: Guardar respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
